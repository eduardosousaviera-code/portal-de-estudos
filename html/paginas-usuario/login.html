<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/png" href="/img/biblioteca/favicon.png">
    <link rel="stylesheet" href="/css/padrao_correção/style.css">
    <link rel="stylesheet" href="/css/padrao_correção/cadastrologin.css">
</head>
<body>
    <header>
        <h1>Coloque seu nome de usuário e senha</h1>
    </header>
    <main>
        <section class="avrt2">
            {% if erro %}
                <p class="mensagem-erro">{{ erro }}</p>
            {% endif %}

            <form method="POST" action="/login" class="avrt">
                <div class="tabela">
                    <div class="textbox">
                        <input type="text" name="usuario" placeholder="Nome de usuário" autocomplete="username" required>
                        <br>
                        <input type="password" name="senha" placeholder="Senha" autocomplete="current-password" required>
                    </div>
                </div>

                <button type="submit" class="bt2 botao">Entrar</button>
            </form>

            <div class="avrt">
                <a class="bt2 botao2" href="/cadastro">Criar conta</a>
                <a class="bt2 botao2" href="/">Voltar</a>
            </div>
        </section>
    </main>
    <footer>
        <p>2026</p>
    </footer>
</body>
</html>
