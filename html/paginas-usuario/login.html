<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="icon" type="image/png" href="/img/biblioteca/favicon.png">
    <link rel="stylesheet" href="/css/padrao_correção/style.css">
    <link rel="stylesheet" href="/css/padrao_correção/cadastrologin.css">
</head>
<body>
    <header>
        <h1>Coloque seu nome de Usuario e Senha</h1>
    </header>
    <main>
        <section class="avrt2">
            {% if erro %}
                <p class="mensagem-erro">{{ erro }}</p>
            {% endif %}

            <form method="POST" action="/login">
                <div class="tabela">
                    <div class="textbox">
                        <input type="text" name="usuario" placeholder="nome de usuario" autocomplete="username" required>
                        <br>
                        <input type="password" name="senha" placeholder="senha" autocomplete="current-password" required>
                    </div>
                </div>

                <div class="avrt">
                    <div class="bt2">
                        <button type="submit" class="botao">confirmar</button>
                    </div>
                    <div class="bt2">
                        <a class="botao2" href="/">voltar</a>
                    </div>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>2026</p>
    </footer>
</body>
</html>
